name: Deploy Engagement Party

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: engagement-party-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify required secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "Missing CLOUDFLARE_API_TOKEN" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "Missing CLOUDFLARE_ACCOUNT_ID" && exit 1)
          test -n "$CLOUDFLARE_D1_DATABASE_ID" || (echo "Missing CLOUDFLARE_D1_DATABASE_ID" && exit 1)
      - name: Upgrade npm
        run: npm install --global npm@11.19.1
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Insert production D1 database ID
        run: node -e "const fs=require('fs'); const p='wrangler.jsonc'; const s=fs.readFileSync(p,'utf8'); if(!s.includes('REPLACE_AFTER_D1_CREATION')) throw new Error('Expected D1 placeholder not found'); fs.writeFileSync(p,s.replace('REPLACE_AFTER_D1_CREATION',process.env.CLOUDFLARE_D1_DATABASE_ID));"
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
      - name: Deploy Worker
        run: npm run deploy
      - name: Production route smoke check
        shell: bash
        run: |
          set -euo pipefail
          base="https://engagement-party.matthagersr.workers.dev"
          check_path() {
            local path="$1"
            local expected_root="$2"
            local body_file
            body_file="$(mktemp)"
            local code
            code="$(curl --silent --show-error --max-time 20 --output "$body_file" --write-out '%{http_code}' --location-trusted --max-redirs 0 "$base$path" || true)"
            echo "$path -> HTTP $code"
            head -c 300 "$body_file" || true
            echo
            if [ "$expected_root" = "yes" ]; then
              test "$code" = "200" || { echo "Public RSVP root must return 200"; exit 1; }
            else
              test "$code" != "404" || { echo "Protected admin route unexpectedly returned 404"; exit 1; }
            fi
          }
          check_path "/" yes
          check_path "/admin" no
          check_path "/api/admin/stats" no
          check_path "/api/admin/rsvps" no
